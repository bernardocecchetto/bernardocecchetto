<svg xmlns="http://www.w3.org/2000/svg" width="840" height="196" viewBox="0 0 840 196" role="img" aria-label="Bernardo Cecchetto, AI Engineer"><title>Bernardo Cecchetto, AI Engineer</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.pulse{animation:run 5s ease-in-out infinite}@keyframes run{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{transform:translateX(672px);opacity:1}100%{transform:translateX(672px);opacity:0}}</style><text x="24" y="54" font-size="34" font-weight="700" fill="#1f2328" text-anchor="start">Bernardo Cecchetto</text><text x="24" y="86" font-size="17" font-weight="400" fill="#59636e" text-anchor="start">AI Engineer. I take AI from prototype to production.</text><line x1="84" y1="142" x2="756" y2="142" stroke="#d1d9e0" stroke-width="2"/><circle cx="84" cy="142" r="7" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="84" y="172" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">Documents &amp; data</text><circle cx="252" cy="142" r="7" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="252" y="172" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">OCR &amp; retrieval</text><circle cx="420" cy="142" r="7" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="420" y="172" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">Agents &amp; tools</text><circle cx="588" cy="142" r="7" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="588" y="172" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">APIs &amp; infra</text><circle cx="756" cy="142" r="7" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="756" y="172" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Production</text><circle class="pulse" cy="142" r="4" cx="84" fill="#0f766e"/></svg>
